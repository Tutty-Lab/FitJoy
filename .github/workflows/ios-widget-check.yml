name: iOS widget compile check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/lib/widget.ts'
      - '.github/workflows/ios-widget-check.yml'
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-game.cjs
      - run: npx cap sync ios
      - name: Compile app and embedded WidgetKit extension without signing
        run: >-
          xcodebuild build -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
